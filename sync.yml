name: Sincronizar datos oficiales
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      catalogo:
        description: "Actualizar también competiciones y grupos"
        type: boolean
        default: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python sincronizar.py ${{ inputs.catalogo && '--catalogo' || '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          COLEGIO: amor de dios
